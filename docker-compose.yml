name: mini-online-shop

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "Shop_Passw0rd!"
    ports:
      - "14330:1433"
    volumes:
      - shop-db:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  api:
    build: ./BackEnd
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Shop: "Server=db,1433;Database=Shop;User Id=sa;Password=Shop_Passw0rd!;TrustServerCertificate=True"
      Jwt__SigningKey: "docker-demo-signing-key-change-me-0123456789"
      DraftSweeper__Interval: "00:01:00"
      DraftSweeper__DraftTimeout: "00:30:00"
    ports:
      - "5080:8080"

  web:
    image: nginx:1.27-alpine
    depends_on:
      - api
    volumes:
      - ./FrontEnd:/usr/share/nginx/html:ro
      - ./FrontEnd/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

volumes:
  shop-db:
